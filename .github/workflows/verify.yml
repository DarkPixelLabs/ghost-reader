name: Verify Ghost Reader

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify core files
        run: |
          for file in index.html style.css app.js detectors.js; do
            if [ ! -f "$file" ]; then
              echo "Error: required core file '$file' is missing."
              exit 1
            fi
          done

      - name: Validate HTML
        run: npx --yes htmlhint --rules '{"tagname-lowercase":true,"attr-lowercase":true,"tag-pair":true,"doctype-first":true}' index.html

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check detectors.js
